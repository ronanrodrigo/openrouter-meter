name: OpenRouterMeter
options:
  bundleIdPrefix: dev.ronanrodrigo
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: pt-BR
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2729VXDM4D
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  Domain:
    path: Packages/Domain
  Application:
    path: Packages/Application
  Infrastructure:
    path: Packages/Infrastructure

targets:
  OpenRouterMeter:
    type: application
    platform: macOS
    sources:
      - path: OpenRouterMeter/Sources
    dependencies:
      - package: Domain
      - package: Application
      - package: Infrastructure
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ronanrodrigo.OpenRouterMeter
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Ronan Rodrigo Nunes"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: OpenRouterMeter/Info.plist
      properties:
        CFBundleName: OpenRouter Meter
        CFBundleDisplayName: OpenRouter Meter
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Ronan Rodrigo Nunes"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false

  OpenRouterMeterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OpenRouterMeter/Tests
    dependencies:
      - target: OpenRouterMeter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ronanrodrigo.OpenRouterMeterTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenRouterMeter:
    build:
      targets:
        OpenRouterMeter: all
        OpenRouterMeterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OpenRouterMeterTests
